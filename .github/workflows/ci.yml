name: Aegis CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-go-proxy:
    name: Go Proxy Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go Dependencies
        run: |
          cd proxy-engine
          go mod tidy

      - name: Compile Go Proxy
        run: |
          cd proxy-engine
          go build -o aegis-proxy main.go

  test-python-sdk:
    name: Python SDK Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SDK and Test Dependencies
        run: |
          cd python-sdk
          # Install the package in editable mode
          pip install -e .
          # Install test-specific requirements
          pip install pytest langchain-community

      - name: Run SDK Tests
        run: |
          cd python-sdk
          # Run the test suite using pytest
          pytest tests/
